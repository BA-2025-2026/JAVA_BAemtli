services:
  backend:
    container_name: baemtli-backend-local
    image: baemtli-backend:1.0.0-6
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_TYPE=${DB_TYPE:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-baemtli}
      - DB_USER=${DB_USER:-baemtli}
      - DB_PASSWORD=${DB_PASSWORD:-baemtli}
    depends_on:
      mysql:
        condition: service_healthy
    # Erlaubt der App genügend Zeit, auf die Azure Serverless DB zu warten
    restart: on-failure

  mysql:
    image: mysql:8.4
    container_name: baemtli-mysql-local
    environment:
      - MYSQL_DATABASE=${DB_NAME:-baemtli}
      - MYSQL_USER=${DB_USER:-baemtli}
      - MYSQL_PASSWORD=${DB_PASSWORD:-baemtli}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
