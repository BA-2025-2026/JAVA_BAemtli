# Application name
spring.application.name=baemtli

# API Versioning
server.servlet.context-path=/api/v1

# Database profile: mssql or mysql
spring.profiles.active=${DB_TYPE:mssql}

# HIBERNATE
spring.jpa.hibernate.ddl-auto=update

# Erzwingt, dass Hibernate EXAKT die Namen aus den @Column-Annotationen nimmt (bug with non-matching table names Java Class <-> MSSQL Azure DB)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
